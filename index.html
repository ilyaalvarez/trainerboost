<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TrainerFlow — La plataforma de gestión de clientes para entrenadores personales hispanohablantes.">
  <title>TrainerFlow — Gestiona. Fideliza. Escala.</title>

  <!-- ── Google Fonts ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">

  <!-- ── CSS ── -->
  <link rel="stylesheet" href="css/main.css">

  <!-- ── Lucide Icons (CDN) — se carga antes de los scripts ── -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- ── Chart.js (CDN) ── -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- App root — todo se inyecta aquí vía JS -->
  <div id="app-root"></div>

  <!-- Toast container — siempre disponible -->
  <div id="toast-container"></div>

  <!-- ════════════════════════════════════════
       JAVASCRIPT — orden estricto de carga
  ════════════════════════════════════════ -->

  <!-- 1. Configuración y constantes -->
  <script src="js/config.js"></script>

  <!-- 2. Estado global y datos de ejemplo -->
  <script src="js/store/state.js"></script>

  <!-- 3. Utilidades transversales -->
  <script src="js/utils.js"></script>

  <!-- 4. Servicios de negocio -->
  <script src="js/services/auth.js"></script>
  <script src="js/services/clients.js"></script>
  <script src="js/services/routines.js"></script>
  <script src="js/services/checkins.js"></script>

  <!-- 5. Componentes UI reutilizables -->
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/charts.js"></script>
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/notifications.js"></script>

  <!-- 6. Páginas / Vistas -->
  <script src="js/pages/landing.js"></script>
  <script src="js/pages/auth.js"></script>
  <script src="js/pages/onboarding.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/clients.js"></script>
  <script src="js/pages/routines.js"></script>
  <script src="js/pages/checkins.js"></script>
  <script src="js/pages/messages.js"></script>
  <script src="js/pages/analytics.js"></script>
  <script src="js/pages/billing.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/portal.js"></script>

  <!-- 7. App principal — router + init (último siempre) -->
  <script src="js/app.js"></script>

</body>
</html>
